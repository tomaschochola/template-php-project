networks:
    devcontainer:
        internal: false
    mysql:
        internal: true
    valkey:
        internal: true
    wiremock:
        internal: true

secrets:
    db_password:
        file: './mysql_password'
    db_root_password:
        file: './mysql_password'

services:
    devcontainer:
        build:
            context: './'
            dockerfile: 'Dockerfile'
        command:
            - 'sleep'
            - 'infinity'
        depends_on:
            mysql:
                condition: 'service_healthy'
                restart: true
            valkey:
                condition: 'service_healthy'
                restart: true
            wiremock:
                condition: 'service_healthy'
                restart: true
        environment:
            APP_ENV: 'local'
            MYSQL_DATABASE: 'db'
            MYSQL_HOST: 'mysql'
            MYSQL_PASSWORD_FILE: '/run/secrets/db_password'
            MYSQL_ROOT_PASSWORD_FILE: '/run/secrets/db_root_password'
            MYSQL_UNIT_DATABASE: 'db_unit'
            MYSQL_USER: 'db'
            NODE_ENV: 'development'
            WIREMOCK_URL: 'http://wiremock:8080'
        init: true
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks:
            - 'devcontainer'
            - 'mysql'
            - 'valkey'
            - 'wiremock'
        ports:
            - app_protocol: 'http'
              host_ip: '127.0.0.1'
              name: 'app'
              protocol: 'tcp'
              target: 8080
        restart: 'unless-stopped'
        secrets:
            - 'db_password'
            - 'db_root_password'
        shm_size: '128mb'
        volumes:
            - bind:
                  create_host_path: false
              source: '..'
              target: '/workspace'
              type: 'bind'
        working_dir: '/workspace'

    mysql:
        environment:
            MYSQL_DATABASE: 'db'
            MYSQL_PASSWORD_FILE: '/run/secrets/db_password'
            MYSQL_ROOT_PASSWORD_FILE: '/run/secrets/db_root_password'
            MYSQL_USER: 'db'
        healthcheck:
            interval: '10s'
            retries: 3
            start_period: '30s'
            test: ['CMD', 'mysqladmin', 'ping', '--host=127.0.0.1', '--silent']
            timeout: '5s'
        image: 'docker.io/library/mysql:9.7.4@sha256:8fb11c38b3551e22d50adbb688f027f8ff4ea2d2445aa277c1cc97b4af85ec54'
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks:
            - 'mysql'
        restart: 'unless-stopped'
        secrets:
            - 'db_password'
            - 'db_root_password'
        shm_size: '128mb'
        stop_grace_period: '60s'
        volumes:
            - bind:
                  create_host_path: false
              read_only: true
              source: './mysql/99_unit.sql'
              target: '/docker-entrypoint-initdb.d/99_unit.sql'
              type: 'bind'
            - source: 'mysql_data'
              target: '/var/lib/mysql'
              type: 'volume'

    valkey:
        healthcheck:
            interval: '10s'
            retries: 3
            start_period: '10s'
            test: ['CMD', 'valkey-cli', 'ping']
            timeout: '5s'
        image: 'docker.io/valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7'
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks:
            - 'valkey'
        restart: 'unless-stopped'
        shm_size: '128mb'
        stop_grace_period: '30s'
        volumes:
            - source: 'valkey_data'
              target: '/data'
              type: 'volume'

    wiremock:
        healthcheck:
            interval: '10s'
            retries: 3
            start_period: '30s'
            test: ['CMD', 'curl', '--fail', '--silent', '--show-error', 'http://127.0.0.1:8080/__admin/health']
            timeout: '5s'
        image: 'docker.io/wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3'
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks: ['wiremock']
        restart: 'unless-stopped'
        shm_size: '128mb'
        stop_grace_period: '30s'
        volumes:
            - bind:
                  create_host_path: false
              read_only: true
              source: './wiremock/mappings'
              target: '/home/wiremock/mappings'
              type: 'bind'

volumes:
    mysql_data:
    valkey_data:
