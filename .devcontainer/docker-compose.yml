networks:
    devcontainer:
        internal: false
    mysql:
        internal: true
    valkey:
        internal: true
    wiremock:
        internal: true

secrets:
    db_password:
        file: './mysql_password'
    db_root_password:
        file: './mysql_password'

services:
    devcontainer:
        build:
            context: './'
            dockerfile: 'Dockerfile'
        command:
            - 'sleep'
            - 'infinity'
        depends_on:
            mysql:
                condition: 'service_healthy'
                restart: true
            valkey:
                condition: 'service_healthy'
                restart: true
            wiremock:
                condition: 'service_healthy'
                restart: true
        environment:
            APP_ENV: 'local'
            MYSQL_DATABASE: 'db'
            MYSQL_HOST: 'mysql'
            MYSQL_PASSWORD_FILE: '/run/secrets/db_password'
            MYSQL_ROOT_PASSWORD_FILE: '/run/secrets/db_root_password'
            MYSQL_UNIT_DATABASE: 'db_unit'
            MYSQL_USER: 'db'
            NODE_ENV: 'development'
            WIREMOCK_URL: 'http://wiremock:8080'
        init: true
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks:
            - 'devcontainer'
            - 'mysql'
            - 'valkey'
            - 'wiremock'
        ports:
            - '61050:61050'
            - '127.0.0.1:61051-61052:61051-61052'
            - '61053:61053'
            - '127.0.0.1:61054-61059:61054-61059'
        restart: 'always'
        secrets:
            - 'db_password'
            - 'db_root_password'
        shm_size: '128mb'
        volumes:
            - bind:
                  create_host_path: false
              source: '..'
              target: '/workspace'
              type: 'bind'
        working_dir: '/workspace'

    mysql:
        environment:
            MYSQL_DATABASE: 'db'
            MYSQL_PASSWORD_FILE: '/run/secrets/db_password'
            MYSQL_ROOT_PASSWORD_FILE: '/run/secrets/db_root_password'
            MYSQL_USER: 'db'
        healthcheck:
            interval: '10s'
            retries: 3
            start_period: '30s'
            test: ['CMD', 'mysqladmin', 'ping', '--host=127.0.0.1', '--silent']
            timeout: '5s'
        image: 'docker.io/library/mysql@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70'
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks:
            - 'mysql'
        restart: 'always'
        secrets:
            - 'db_password'
            - 'db_root_password'
        shm_size: '128mb'
        stop_grace_period: '60s'
        volumes:
            - bind:
                  create_host_path: false
              read_only: true
              source: './mysql/99_unit.sql'
              target: '/docker-entrypoint-initdb.d/99_unit.sql'
              type: 'bind'
            - source: 'mysql_data'
              target: '/var/lib/mysql'
              type: 'volume'

    valkey:
        healthcheck:
            interval: '10s'
            retries: 3
            start_period: '10s'
            test: ['CMD', 'valkey-cli', 'ping']
            timeout: '5s'
        image: 'docker.io/valkey/valkey@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd'
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks:
            - 'valkey'
        restart: 'always'
        shm_size: '128mb'
        stop_grace_period: '30s'
        volumes:
            - source: 'valkey_data'
              target: '/data'
              type: 'volume'

    wiremock:
        healthcheck:
            interval: '10s'
            retries: 3
            start_period: '30s'
            test: ['CMD', 'curl', '--fail', '--silent', '--show-error', 'http://127.0.0.1:8080/__admin/health']
            timeout: '5s'
        image: 'docker.io/wiremock/wiremock@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3'
        logging:
            driver: 'json-file'
            options:
                max-file: '3'
                max-size: '10m'
        networks: ['wiremock']
        restart: 'always'
        shm_size: '128mb'
        stop_grace_period: '30s'

volumes:
    mysql_data:
    valkey_data:
